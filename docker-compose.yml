  # VPN entrypoint into the biyard-dev network. Clients get a split tunnel
  # (only 172.19.0.0/16 is routed) and DNS via dnsmasq → Docker embedded DNS,
  # so services resolve by their container names (n8n, ollama, ...).
  # Issue a client profile with: ./gen-vpn-client.sh <name>
  openvpn:
    container_name: openvpn
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.openvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: 1
    ports:
      - "1194:1194/udp"
    volumes:
      - ./openvpn:/etc/openvpn
      # Mounted rather than baked in, so entrypoint edits apply on restart
      # without an image rebuild (the Dockerfile still COPYs it as a fallback).
      - ./openvpn-entrypoint.sh:/usr/local/bin/openvpn-entrypoint.sh:ro
    environment:
      OVPN_REMOTE: "vpn.miner.biyard.co 1194"
      OVPN_PUSH_ROUTE: "172.19.0.0 255.255.0.0;192.168.0.1 255.255.255.255;192.168.0.42 255.255.255.255"

  certbot:
    container_name: certbot
    image: certbot/certbot
    volumes:
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/var:/var/lib/letsencrypt
      - ./certbot/webroot:/var/www/certbot

  n8n:
    container_name: n8n
    restart: always
    image: docker.n8n.io/n8nio/n8n
    volumes:
      - ./.n8n:/home/node/.n8n
    environment:
      N8N_SECURE_COOKIE: false
      TZ: Asia/Seoul
      DB_TYPE: "sqlite"
      DB_SQLITE_DATABASE: "/home/node/.n8n/database.sqlite"
      N8N_PORT: "9000"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      GENERIC_TIMEZONE: "Asia/Seoul"
      N8N_DOMAIN: "n8n.hackartist.io"
      WEBHOOK_URL: https://n8n.hackartist.io/
      N8N_PROXY_HOPS: 1
      NODE_FUNCTION_ALLOW_BUILTIN: "*"
