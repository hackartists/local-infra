# {svc}-{pr}.pr.biyard.co  — per-PR static preview hosting
#
#   asset-1.pr.biyard.co
#     /      -> static files in  /var/www/pr/asset-1   (host: nginx/webroot/asset-1)
#     /api/  -> https://asset.biyard.co/api/
#
#   essence-1.pr.biyard.co
#     /      -> static files in  /var/www/pr/essence-1 (host: nginx/webroot/essence-1)
#     /api/  -> https://essence.biyard.co/api/
#
# Requires a wildcard cert for *.pr.biyard.co (DNS-01 challenge):
#   certbot certonly --manual --preferred-challenges dns -d '*.pr.biyard.co'

# HTTP - redirect to HTTPS & serve ACME challenge
server {
    listen 80;
    server_name ~^(?<svc>[a-z0-9]+)-(?<pr>\d+)\.pr\.biyard\.co$;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP — asset-report redirect (the generic :80 block's `[a-z0-9]+-\d+` regex
# doesn't match the extra `report` label).
server {
    listen 80;
    server_name ~^asset-report-\d+\.pr\.biyard\.co$;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — asset PR Playwright report (static HTML, no /api). The e2e CI job
# publishes the report to /var/www/pr/asset-report-<pr> (the runner writes
# nginx/webroot). More specific than the asset-<pr> block below (extra `report`
# label), and non-overlapping, but listed first for clarity.
server {
    listen 443 ssl;
    server_name ~^asset-report-(?<pr>\d+)\.pr\.biyard\.co$;

    ssl_certificate /etc/letsencrypt/live/pr.biyard.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pr.biyard.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /var/www/pr/asset-report-$pr;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS — asset PR e2e (FULL-STACK). Placed BEFORE the generic block so it wins
# for asset-<pr> hosts (nginx matches regex server_names top-to-bottom). Unlike
# the generic block (static console + PROD /api), this routes /api to THIS PR's
# own app-server container on biyard-dev — the stack the asset e2e CI job brings
# up (docker-compose.e2e.yaml, network alias pr-<pr>-app-server). Other services
# (essence, …) fall through to the generic block and keep proxying /api to prod.
# Trade-off: an asset PR with no running e2e stack gets /api 502 (no static-vs-prod
# preview) — accepted (docs/gold-e2e/plan.md § PR-격리).
server {
    listen 443 ssl;
    server_name ~^asset-(?<pr>\d+)\.pr\.biyard\.co$;

    ssl_certificate /etc/letsencrypt/live/pr.biyard.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pr.biyard.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker embedded DNS (biyard-dev) — resolves the per-PR app-server alias.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # /api/web-crawler → this PR's web-crawler service (seo-meta autofill etc.).
    # Longest-prefix wins over /api/ below, so this beats the app-server route.
    location /api/web-crawler {
        set $wc_backend "pr-$pr-web-crawler:8000";
        proxy_pass http://$wc_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # /assets-local-* → shared MinIO (S3 presigned browser upload/download). The
    # app-server signs presigned URLs for THIS host (S3_PRESIGN_ENDPOINT), so the
    # Host header must pass through unchanged for MinIO's SigV4 check.
    location /assets-local- {
        set $minio_backend "minio:9000";
        proxy_pass http://$minio_backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # /api/ → this PR's e2e app-server (HTTP, on biyard-dev). Variable upstream
    # so nginx starts before the stack is up (502 until present); the original
    # request URI (incl. the /api/ prefix) is forwarded unchanged.
    location /api/ {
        set $api_backend "pr-$pr-app-server:8080";
        proxy_pass http://$api_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # /ws → same app-server (realtime), kept for parity.
    location = /ws {
        set $ws_backend "pr-$pr-app-server:8080";
        proxy_pass http://$ws_backend;

        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # / → the PR's prebuilt console dist (CI writes nginx/webroot/asset-<pr>).
    location / {
        root /var/www/pr/asset-$pr;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS — generic per-PR static preview (essence, and any non-asset svc):
# static console + /api → PROD {svc}.biyard.co. Unchanged.
server {
    listen 443 ssl;
    server_name ~^(?<svc>[a-z0-9]+)-(?<pr>\d+)\.pr\.biyard\.co$;

    ssl_certificate /etc/letsencrypt/live/pr.biyard.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pr.biyard.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Public resolver: needed because the /api upstream host is built from a variable.
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # /api/  ->  https://{svc}.biyard.co/api/   (original URI is preserved)
    location /api/ {
        set $api_backend "$svc.biyard.co";
        proxy_pass https://$api_backend;

        proxy_ssl_server_name on;            # send SNI to upstream
        proxy_set_header Host $api_backend;  # upstream expects its own vhost
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # /  ->  static files under /var/www/pr/{svc}-{pr}  (SPA fallback to index.html)
    location / {
        root /var/www/pr/$svc-$pr;
        try_files $uri $uri/ /index.html;
    }
}
