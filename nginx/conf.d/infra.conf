# (ollama.miner.biyard.co의 HTTPS 블록은 제거됨 — open-webui가 k3s로 이관되어
#  stream SNI가 443에서 곧장 k3s로 보낸다. compose open-webui 정지 후에는
#  `open-webui` 이름의 DNS 해석이 불가해 nginx 기동 자체가 실패하므로
#  dead 블록을 남겨둘 수 없었다. :80 리다이렉트 블록은 위에 유지.)

# HTTP - redirect to HTTPS & serve ACME challenge
server {
    listen 80;
    server_name qdrant.miner.biyard.co;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 8443 ssl;
    server_name qdrant.miner.biyard.co;

    ssl_certificate /etc/letsencrypt/live/miner.biyard.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miner.biyard.co/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location = / {
        return 302 /dashboard;
    }

    location / {
        proxy_pass http://qdrant:6333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (needed by n8n)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}