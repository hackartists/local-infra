# *.dev.biyard.co — k3s-hosted (TLS passthrough on :443 via the stream SNI
# map in nginx.conf; certs are issued in-cluster by cert-manager, so no ACME
# webroot is needed here). This block only bounces plain HTTP to HTTPS.
server {
    listen 80;
    server_name *.dev.biyard.co;

    location / {
        return 301 https://$host$request_uri;
    }
}
