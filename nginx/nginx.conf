events {
    worker_connections 1024;
}

# SNI-based L4 split: infra hosts migrated to k3s get raw TLS passthrough
# (cert-manager terminates TLS in-cluster); every other vhost keeps being
# served locally and now listens on 8443 behind this stream proxy.
stream {
    map $ssl_preread_server_name $tls_backend {
        hostnames;
        s3.miner.biyard.co        k3s_ingress;
        pg.miner.biyard.co        k3s_ingress;
        redpanda.miner.biyard.co  k3s_ingress;
        qdrant.miner.biyard.co    k3s_ingress;
        # All of *.dev.biyard.co is k3s-hosted (dev.biyard.co apex itself
        # resolves to CloudFront and never reaches this box).
        .dev.biyard.co            k3s_ingress;
        # *.pr.biyard.co previews are k3s-hosted (pr-webroot wildcard ingress;
        # per-PR full-stack releases override it with exact-host ingresses).
        .pr.biyard.co             k3s_ingress;
        # n8n runs in k3s with its own ingress + *.hackartist.io cert
        # (the legacy NodePort 30900 path in conf.d/n8n.conf is now dead).
        n8n.hackartist.io         k3s_ingress;
        # open-webui moved into k3s (talks to host ollama via the selectorless
        # infra/ollama Service); infra.conf's 8443 block is now dead.
        ollama.miner.biyard.co    k3s_ingress;
        default                   local_vhosts;
    }

    upstream k3s_ingress {
        server 192.168.0.54:443;
    }

    upstream local_vhosts {
        server 127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $tls_backend;
    }

    # OpenVPN moved into k3s (hostPort on the server node); keep
    # vpn.miner.biyard.co:1194 landing here and relay the UDP stream so the
    # router port-forward doesn't need to change.
    upstream k3s_openvpn {
        server 192.168.0.54:1194;
    }

    server {
        listen 1194 udp;
        proxy_pass k3s_openvpn;
    }
}

http {
    # Map file extensions to Content-Type. Without this, nginx's built-in
    # default map only covers html/gif/jpg, so .css/.js fall through to
    # default_type (text/plain) — which makes browsers refuse stylesheets and
    # block ES module scripts ("Expected a JavaScript module script but ...
    # MIME type of text/plain"). Required for the per-PR static previews.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /etc/nginx/conf.d/*.conf;
}
