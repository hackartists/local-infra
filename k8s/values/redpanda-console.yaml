# Redpanda Console for the single-node dev broker.
#
# The redpanda/redpanda chart (26.2.1) no longer ships a working in-chart
# Console Deployment (console.deployment.create defaults to false), so
# Console is deployed from the separate redpanda/console chart instead.
# Points at the redpanda StatefulSet's headless service / pod-0 DNS name.

replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: lima-k3s-server

config:
  kafka:
    brokers:
      - redpanda-0.redpanda.infra.svc.cluster.local:9093
  redpanda:
    adminApi:
      urls:
        - http://redpanda-0.redpanda.infra.svc.cluster.local:9644

# NOTE (Task 7): the brief's Step 3 targeted `console.ingress` inside
# k8s/values/redpanda.yaml (redpanda/redpanda chart), but that chart's
# in-chart console.* is disabled (see redpanda.yaml comment) — Console runs
# as the separate `redpanda-console` release using chart redpanda/console,
# whose ingress keys live at the top level of this file. Key structure
# (enabled/className/hosts/tls) matches `helm show values redpanda/console`.
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: redpanda.miner.biyard.co
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: miner-biyard-co-tls
      hosts:
        - redpanda.miner.biyard.co
