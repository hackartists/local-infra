# Single-node Redpanda for local dev (chart redpanda/redpanda 26.2.1).
# Values verified against `helm show values redpanda/redpanda` for this
# version — several keys differ from older chart releases. See
# task-5-report.md for the full list of adaptations.

statefulset:
  replicas: 1
  # This chart version has no top-level `nodeSelector` key; node pinning is
  # only exposed under statefulset.podTemplate.spec.nodeSelector.
  podTemplate:
    spec:
      nodeSelector:
        kubernetes.io/hostname: lima-k3s-server
  # NOTE: additionalRedpandaCmdFlags for --overprovisioned/--smp are NOT set
  # here — this chart derives --smp, --memory, --reserve-memory and
  # --overprovisioned automatically from resources.cpu/memory below. Adding
  # them again would pass duplicate rpk flags.

# No cert-manager installed yet: TLS must be fully disabled. Setting
# tls.enabled: false here disables TLS for every listener (kafka, admin,
# rpc, schemaRegistry, http) since none of them override it individually.
tls:
  enabled: false

# No NodePort/LoadBalancer external service needed for a cluster-internal
# dev broker.
external:
  enabled: false

resources:
  cpu:
    cores: 1
  memory:
    container:
      max: 1.5Gi

storage:
  persistentVolume:
    enabled: true
    size: 20Gi
    storageClass: local-path

config:
  cluster:
    auto_create_topics_enabled: true

# Avoid the privileged `tuning` init container (SYS_RESOURCE + privileged:
# true) that tune_aio_events: true (the chart default) requires — not
# needed for a single-node dev broker.
tuning:
  tune_aio_events: false

# This chart's `console.*` keys only gate a legacy in-chart Console
# Deployment whose configmap/secret/deployment.create default to false, so
# they render nothing regardless. Redpanda Console is deployed separately
# via the redpanda/console chart (release `redpanda-console` in
# helmfile.yaml) pointed at this broker's headless service.
console:
  enabled: false
