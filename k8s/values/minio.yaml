mode: standalone
replicas: 1

rootUser: minioadmin
rootPassword: minioadmin

persistence:
  enabled: true
  storageClass: local-path
  size: 100Gi

nodeSelector:
  kubernetes.io/hostname: lima-k3s-server

resources:
  requests:
    memory: 512Mi

environment:
  MINIO_BROWSER_REDIRECT_URL: https://s3.miner.biyard.co

consoleIngress:
  enabled: true
  ingressClassName: nginx
  # 공인망 무인증 노출 방지(콘솔 자체 로그인 앞단의 추가 게이트). Secret은
  # infra ns의 console-basic-auth 재사용 — k8s/values/redpanda-console.yaml 참조.
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: console-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Restricted"
  path: /
  hosts:
    - s3.miner.biyard.co
    - s3.dev.biyard.co
  tls:
    - secretName: miner-biyard-co-tls
      hosts:
        - s3.miner.biyard.co
    - secretName: dev-biyard-co-tls
      hosts:
        - s3.dev.biyard.co
