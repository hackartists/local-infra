# Local dev infra on k3s. Deploy everything with: helmfile -f k8s/helmfile.yaml apply
repositories:
  - name: minio
    url: https://charts.min.io/
  - name: qdrant
    url: https://qdrant.github.io/qdrant-helm
  - name: redpanda
    url: https://charts.redpanda.com
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: pg-stack
    namespace: infra
    chart: ./charts/pg-stack
  - name: minio
    namespace: infra
    chart: minio/minio
    values:
      - values/minio.yaml
  - name: minio-init
    namespace: infra
    chart: ./charts/minio-init
    needs:
      - infra/minio
  - name: qdrant
    namespace: infra
    chart: qdrant/qdrant
    values:
      - values/qdrant.yaml
  - name: redpanda
    namespace: infra
    chart: redpanda/redpanda
    values:
      - values/redpanda.yaml
  - name: redpanda-console
    namespace: infra
    chart: redpanda/console
    values:
      - values/redpanda-console.yaml
    needs:
      - infra/redpanda
