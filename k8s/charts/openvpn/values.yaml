# Image is built locally and imported into the server node's containerd
# (no registry): docker build -f Dockerfile.openvpn -t openvpn-server:vN . &&
# docker save openvpn-server:vN | limactl shell k3s-server -- sudo k3s ctr images import -
# Bump the tag on every entrypoint change so the rollout picks it up.
image: openvpn-server:v2

# Pinned to the node holding the image; its LAN IP (192.168.0.54) is also the
# hostPort target the Mac nginx relays vpn.miner.biyard.co:1194/udp to.
nodeSelector:
  kubernetes.io/hostname: lima-k3s-server

hostPort: 1194
storage: 128Mi
storageClass: local-path

# Public endpoint baked into generated client profiles.
remote: "vpn.miner.biyard.co 1194"
# Split-tunnel routes pushed to clients: k3s service + pod CIDRs only.
# Do NOT push LAN host routes (192.168.0.1/.42): the router hairpin-SNATs
# LAN clients to 192.168.0.1, so a client on the Mac that routes 192.168.0.1
# into the tunnel black-holes the nginx relay's replies and the session dies
# right after the handshake. Host services are reachable via cluster
# services instead (e.g. the infra/ollama EndpointSlice).
pushRoutes: "10.43.0.0 255.255.0.0;10.42.0.0 255.255.0.0"
# Search domains pushed to clients so "postgres" == postgres.infra.svc.cluster.local.
pushDomains: "infra.svc.cluster.local;svc.cluster.local;cluster.local"
# Zones the in-pod dnsmasq forwards to CoreDNS (cluster names + reverse
# zones for the service/pod CIDRs); everything else goes to public resolvers.
clusterDomains: "cluster.local;43.10.in-addr.arpa;42.10.in-addr.arpa"
