apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: runner
spec:
  serviceName: runner
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  # CI 러너는 롤링 재시작이 진행 중인 잡을 죽인다 —
  # 스펙 변경은 유휴 파드를 수동 삭제할 때만 반영.
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: runner
  template:
    metadata:
      labels:
        app: runner
    spec:
      serviceAccountName: runner
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      containers:
        - name: runner
          image: {{ .Values.image }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          env:
            - name: LABELS
              value: linux,arm64,docker
          volumeMounts:
            - name: state
              mountPath: /root/runner
            # 구 compose 마운트 ./nginx/webroot:/root/nginx 경로 호환 —
            # CI 잡이 여기 쓰면 pr-nginx가 즉시 서빙한다.
            - name: pr-webroot
              mountPath: /root/nginx
      volumes:
        - name: pr-webroot
          persistentVolumeClaim:
            claimName: pr-webroot
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.stateSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: runner
spec:
  clusterIP: None
  selector:
    app: runner
