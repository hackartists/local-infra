apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkitd-cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.cacheSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO 캐시 PVC 공유 불가 → 동시 2개 금지
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      containers:
        - name: buildkitd
          image: {{ .Values.image }}
          args:
            - --addr
            - tcp://0.0.0.0:1234
          securityContext:
            privileged: true
          ports:
            - containerPort: 1234
          readinessProbe:
            exec:
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /var/lib/buildkit
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: buildkitd-cache
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
spec:
  selector:
    app: buildkitd
  ports:
    - port: 1234
      targetPort: 1234
---
# 전환기: 클러스터 밖(compose 러너, 개발자 Mac)에서의 빌드용
apiVersion: v1
kind: Service
metadata:
  name: buildkitd-nodeport
spec:
  type: NodePort
  selector:
    app: buildkitd
  ports:
    - port: 1234
      targetPort: 1234
      nodePort: {{ .Values.nodePort }}
