# Holds /home/node/.n8n (sqlite DB, encryption key, installed nodes).
# Seeded once from the compose-era ./.n8n dir; see repo docs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1
  # sqlite on RWO volume: never two instances at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      # local-path provisions a root-owned dir; n8n runs as node (uid 1000)
      initContainers:
        - name: chown-data
          image: busybox:1.36
          command: ["chown", "-R", "1000:1000", "/home/node/.n8n"]
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      containers:
        - name: n8n
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.port }}
              name: http
          env:
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: DB_TYPE
              value: sqlite
            - name: DB_SQLITE_DATABASE
              value: /home/node/.n8n/database.sqlite
            - name: N8N_PORT
              value: {{ .Values.port | quote }}
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "168"
            - name: GENERIC_TIMEZONE
              value: {{ .Values.timezone | quote }}
            - name: N8N_DOMAIN
              value: {{ .Values.domain | quote }}
            - name: WEBHOOK_URL
              value: {{ .Values.webhookUrl | quote }}
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: NODE_FUNCTION_ALLOW_BUILTIN
              value: "*"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector:
    app: n8n
  ports:
    - port: {{ .Values.port }}
      targetPort: http
---
# Legacy path: Mac nginx TLS 종단 후 이 NodePort로 프록시하던 경로.
# ingress 전환 후에도 롤백 대비로 유지 (제거는 후속 정리).
apiVersion: v1
kind: Service
metadata:
  name: n8n-nodeport
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
    - port: {{ .Values.port }}
      targetPort: http
      nodePort: {{ .Values.nodePort }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  annotations:
    # 워크플로우 import 등 대용량 업로드 대비
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: {{ .Values.port }}
{{- end }}
