apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-bridge-config
data:
  connect.yaml: |
    # no explicit address: the input attaches to Connect's shared service
    # HTTP server (:{{ .Values.port }}), alongside /ping used by the probe
    input:
      http_server:
        path: /inbound
        allowed_verbs: [ POST ]
    output:
      kafka_franz:
        seed_brokers: [ "{{ .Values.brokers }}" ]
        topic: {{ .Values.topic }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mail-bridge
  template:
    metadata:
      labels:
        app: mail-bridge
      # config lives in the same template file, so no checksum annotation
      # (it would self-recurse); after config edits: rollout restart.
    spec:
      containers:
        - name: connect
          image: {{ .Values.image }}
          args: ["run", "/etc/connect/connect.yaml"]
          ports:
            - containerPort: {{ .Values.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/connect
      volumes:
        - name: config
          configMap:
            name: mail-bridge-config
---
apiVersion: v1
kind: Service
metadata:
  name: mail-bridge
spec:
  selector:
    app: mail-bridge
  ports:
    - port: {{ .Values.port }}
      targetPort: http
