nodeSelector:
  kubernetes.io/hostname: lima-k3s-server

postgres:
  image: postgres:16-alpine
  user: asset
  password: asset
  db: asset
  storage: 20Gi
  storageClass: local-path
  nodePort: 30432

adminer:
  image: adminer:latest
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: pg.miner.biyard.co
        tlsSecret: miner-biyard-co-tls
      - host: pg.dev.biyard.co
        tlsSecret: dev-biyard-co-tls
