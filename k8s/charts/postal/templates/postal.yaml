# postal.yml template. DB/rails secrets are injected at pod start by the
# render-config initContainer (sed) so they never live in a ConfigMap.
# Secret values are hex strings (see values.yaml bootstrap command), so the
# sed substitution needs no escaping.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postal-config
data:
  postal.yml: |
    version: 2
    postal:
      web_hostname: {{ .Values.webHostname }}
      web_protocol: https
      smtp_hostname: {{ .Values.smtpHostname }}
      use_ip_pools: false
      # SSRF guard allowlist for HTTP endpoints (cluster-local webhook)
      allowed_request_destinations:
{{- range .Values.allowedRequestDestinations }}
        - {{ . | quote }}
{{- end }}
    web_server:
      default_port: {{ .Values.webPort }}
      default_bind_address: 0.0.0.0
    smtp_server:
      default_port: {{ .Values.smtpContainerPort }}
      default_bind_address: 0.0.0.0
      tls_enabled: false
    dns:
      mx_records:
        - {{ .Values.smtpHostname }}
      smtp_server_hostname: {{ .Values.smtpHostname }}
      spf_include: spf.{{ .Values.mailDomain }}
      return_path_domain: rp.{{ .Values.mailDomain }}
      route_domain: routes.{{ .Values.mailDomain }}
      track_domain: track.{{ .Values.mailDomain }}
    main_db:
      host: postal-mariadb
      username: postal
      password: "@DB_PASSWORD@"
      database: postal
    message_db:
      host: postal-mariadb
      username: postal
      password: "@DB_PASSWORD@"
      prefix: postal
    logging:
      stdout: true
    rails:
      secret_key: "@RAILS_SECRET@"
{{- define "postal.configInit" }}
        - name: render-config
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              sed -e "s|@DB_PASSWORD@|$DB_PASSWORD|" \
                  -e "s|@RAILS_SECRET@|$RAILS_SECRET|" \
                  /template/postal.yml > /config/postal.yml
              cp /secrets/signing.key /config/signing.key
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: db-password
            - name: RAILS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: rails-secret-key
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: config-template, mountPath: /template }
            - { name: secrets, mountPath: /secrets }
{{- end }}
{{- define "postal.volumes" }}
      volumes:
        - name: config
          emptyDir: {}
        - name: config-template
          configMap:
            name: postal-config
        - name: secrets
          secret:
            secretName: {{ .Values.secretName }}
{{- end }}
---
# Schema init/migrations. Reruns on every apply; postal initialize is
# idempotent. before-hook-creation keeps old job objects from blocking.
apiVersion: batch/v1
kind: Job
metadata:
  name: postal-initialize
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      initContainers:
{{- include "postal.configInit" . }}
      containers:
        - name: initialize
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["postal", "initialize"]
          volumeMounts:
            - { name: config, mountPath: /config }
{{- include "postal.volumes" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postal-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postal-web
  template:
    metadata:
      labels:
        app: postal-web
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      initContainers:
{{- include "postal.configInit" . }}
      containers:
        - name: web
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["postal", "web-server"]
          ports:
            - containerPort: {{ .Values.webPort }}
              name: http
          readinessProbe:
            httpGet:
              path: /login
              port: http
              # Rails host authorization 403s any other Host value
              httpHeaders:
                - name: Host
                  value: {{ .Values.webHostname }}
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /config }
{{- include "postal.volumes" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postal-smtp
spec:
  replicas: 1
  # hostPort: only one instance can hold 25 on the node
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postal-smtp
  template:
    metadata:
      labels:
        app: postal-smtp
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      initContainers:
{{- include "postal.configInit" . }}
      containers:
        - name: smtp
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["postal", "smtp-server"]
          ports:
            - containerPort: {{ .Values.smtpContainerPort }}
              hostPort: {{ .Values.smtpHostPort }}
              name: smtp
          volumeMounts:
            - { name: config, mountPath: /config }
{{- include "postal.volumes" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postal-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postal-worker
  template:
    metadata:
      labels:
        app: postal-worker
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      initContainers:
{{- include "postal.configInit" . }}
      containers:
        - name: worker
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          command: ["postal", "worker"]
          volumeMounts:
            - { name: config, mountPath: /config }
{{- include "postal.volumes" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: postal-web
spec:
  selector:
    app: postal-web
  ports:
    - port: {{ .Values.webPort }}
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: postal
  annotations:
    # attachment uploads via web UI / API
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.webHostname | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.webHostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: postal-web
                port:
                  number: {{ .Values.webPort }}
{{- end }}
