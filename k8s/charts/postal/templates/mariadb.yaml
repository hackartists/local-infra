apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postal-mariadb-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.mariadbStorage }}
---
# message_db creates one database per Postal mail server (postal-server-N),
# so the postal user needs rights on the postal% pattern, not just one DB.
# initdb scripts only run on an empty datadir.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postal-mariadb-init
data:
  grant.sql: |
    GRANT ALL PRIVILEGES ON `postal%`.* TO 'postal'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postal-mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postal-mariadb
  template:
    metadata:
      labels:
        app: postal-mariadb
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      containers:
        - name: mariadb
          image: {{ .Values.mariadbImage }}
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: mariadb-root-password
            - name: MARIADB_DATABASE
              value: postal
            - name: MARIADB_USER
              value: postal
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: db-password
          ports:
            - containerPort: 3306
              name: mysql
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postal-mariadb-data
        - name: initdb
          configMap:
            name: postal-mariadb-init
---
apiVersion: v1
kind: Service
metadata:
  name: postal-mariadb
spec:
  selector:
    app: postal-mariadb
  ports:
    - port: 3306
      targetPort: mysql
