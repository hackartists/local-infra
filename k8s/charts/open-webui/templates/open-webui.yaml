# Holds /app/backend/data (webui.db, uploads, vector_db, cache).
# Seeded once from the compose-era ./infra/ollama dir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  # sqlite(webui.db) on RWO volume: never two instances at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      containers:
        - name: open-webui
          image: {{ .Values.image }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OLLAMA_BASE_URL
              value: {{ .Values.ollamaBaseUrl | quote }}
            - name: WEBUI_AUTH
              value: "False"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            # 첫 기동 시 모델/임베딩 준비로 오래 걸릴 수 있음
            initialDelaySeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - port: 8080
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  annotations:
    # 문서 업로드(RAG)·모델 파일 대비
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    # WEBUI_AUTH=False라 공인망 무인증 노출 방지 게이트 필요 —
    # 다른 콘솔들과 동일하게 infra ns의 console-basic-auth 재사용.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: console-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Restricted"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  number: 8080
{{- end }}
