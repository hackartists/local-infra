{{- if .Values.admin.enabled }}
# dynamodb-local은 API 엔드포인트뿐이라 웹 콘솔이 없다(구버전의 /shell은 2.0에서 제거).
# 테이블/아이템을 브라우저로 보려면 이 GUI가 따로 필요하다. 상태는 전부
# dynamodb-local 쪽에 있으므로 여기엔 볼륨이 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb-admin
  template:
    metadata:
      labels:
        app: dynamodb-admin
    spec:
      containers:
        - name: dynamodb-admin
          image: {{ .Values.admin.image }}
          env:
            - name: DYNAMO_ENDPOINT
              value: http://dynamodb-local:{{ .Values.port }}
            # 기본값이 localhost라 파드 밖에서 안 닿는다.
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: {{ .Values.admin.port | quote }}
            # 값은 무관하지만 access key는 영숫자여야 한다 — 하이픈 등이 섞이면
            # dynamodb-local이 UnrecognizedClientException으로 거부한다.
            - name: AWS_ACCESS_KEY_ID
              value: dummy
            - name: AWS_SECRET_ACCESS_KEY
              value: dummy
            - name: AWS_REGION
              value: {{ .Values.admin.region | quote }}
          ports:
            - containerPort: {{ .Values.admin.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
---
# ClusterIP only — 무인증 GUI라 ingress는 두지 않는다. VPN에서 http://dynamodb-admin:8001.
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-admin
spec:
  selector:
    app: dynamodb-admin
  ports:
    - port: {{ .Values.admin.port }}
      targetPort: http
{{- end }}
