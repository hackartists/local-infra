nodeSelector:
  kubernetes.io/hostname: lima-k3s-server

image: registry:3
# 노드 registries.yaml 미러가 이 IP를 참조하므로 고정 필수 (k8s/node-config/).
clusterIP: 10.43.200.5
storage: 100Gi
storageClass: local-path

ingress:
  enabled: false
  className: nginx
  host: registry.dev.biyard.co
  tlsSecret: dev-biyard-co-tls
  # Auth is enforced at the ingress (docker login speaks plain basic auth).
  # Reuses the imperative console-basic-auth secret (user `biyard`) — see
  # k8s/values/redpanda-console.yaml for how it is created. Pulls from inside
  # k3s therefore need an imagePullSecret:
  #   kubectl -n <ns> create secret docker-registry regcred \
  #     --docker-server=registry.dev.biyard.co \
  #     --docker-username=biyard --docker-password=<pass>
  authSecret: console-basic-auth
