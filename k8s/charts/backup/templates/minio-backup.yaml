{{- if .Values.minio.enabled }}
# MinIO -> S3 단방향 mirror. --remove를 쓰지 않으므로 MinIO에서 지운 객체는
# S3에 그대로 남는다(append-only). 실수나 침해로 MinIO가 비워져도 S3 사본은
# 살아있게 하려는 의도이며, 그래서 이건 "동기화"가 아니라 백업이다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
spec:
  schedule: {{ .Values.minio.schedule | quote }}
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: mirror
              image: {{ .Values.minio.image }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mc alias set src "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
                  mc alias set dst "{{ .Values.s3.endpoint }}" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"

                  # 버킷 목록을 고정하지 않고 매번 MinIO에서 읽는다 — 앱이
                  # 새 버킷을 만들어도 백업에서 조용히 누락되지 않도록.
                  rc=0
                  for b in $(mc ls src | awk '{print $NF}' | sed 's#/$##'); do
                    case " {{ join " " .Values.minio.excludeBuckets }} " in
                      *" $b "*) echo "-- skip $b (excluded)"; continue ;;
                    esac
                    dest="{{ .Values.minio.bucketPrefix }}${b}"
                    # -p는 멱등 — 이미 있으면 성공으로 넘어간다.
                    mc mb -p "dst/${dest}" || true
                    echo "-- mirror $b -> $dest"
                    if ! mc mirror --overwrite "src/${b}" "dst/${dest}"; then
                      echo "!! mirror failed: $b" >&2
                      rc=1
                    fi
                  done
                  exit $rc
              env:
                - name: MINIO_ENDPOINT
                  value: {{ .Values.minio.endpoint | quote }}
                - name: MINIO_ACCESS_KEY
                  value: {{ .Values.minio.accessKey | quote }}
                - name: MINIO_SECRET_KEY
                  value: {{ .Values.minio.secretKey | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3.credentialsSecret }}
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3.credentialsSecret }}
                      key: secret-access-key
{{- end }}
