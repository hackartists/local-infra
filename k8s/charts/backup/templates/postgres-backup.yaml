{{- if .Values.postgres.enabled }}
# pg_dumpall(초기화 컨테이너) -> emptyDir -> aws s3 cp(본 컨테이너).
# 두 단계를 한 파이프로 잇지 못하는 이유는 pg_dump와 aws-cli가 같은 이미지에
# 없기 때문. initContainer는 본 컨테이너보다 먼저, 순차로 끝난다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: {{ .Values.postgres.schedule | quote }}
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          initContainers:
            - name: dump
              image: {{ .Values.postgres.image }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # 빈 덤프를 S3에 올리지 않도록 pg_dumpall 실패는 즉시 종료.
                  # (파이프 중간 실패를 잡으려면 sh에는 pipefail이 없어 임시
                  #  파일로 받은 뒤 압축한다.)
                  pg_dumpall \
{{- range .Values.postgres.excludeDatabases }}
                    --exclude-database={{ . | quote }} \
{{- end }}
                    > /backup/dump.sql
                  gzip /backup/dump.sql
                  ls -lh /backup/dump.sql.gz
              env:
                - name: PGHOST
                  value: {{ .Values.postgres.host | quote }}
                - name: PGPORT
                  value: {{ .Values.postgres.port | quote }}
                - name: PGUSER
                  value: {{ .Values.postgres.user | quote }}
                - name: PGPASSWORD
                  value: {{ .Values.postgres.password | quote }}
                - name: PGCONNECT_TIMEOUT
                  value: "30"
              volumeMounts:
                - name: dump
                  mountPath: /backup
          containers:
            - name: upload
              image: {{ .Values.postgres.awsCliImage }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  key="{{ .Values.postgres.prefix }}/$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  aws s3 cp /backup/dump.sql.gz \
                    "s3://{{ .Values.postgres.bucket }}/${key}" \
                    --sse AES256 --only-show-errors
                  echo "uploaded s3://{{ .Values.postgres.bucket }}/${key}"
              env:
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.s3.region | quote }}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3.credentialsSecret }}
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.s3.credentialsSecret }}
                      key: secret-access-key
              volumeMounts:
                - name: dump
                  mountPath: /backup
          volumes:
            - name: dump
              emptyDir:
                sizeLimit: {{ .Values.postgres.dumpDiskSize }}
{{- end }}
