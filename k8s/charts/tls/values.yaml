# NOTE: certbot (manual DNS-01, ./init-wildcard-cert.sh) and cert-manager both
# issue for this zone. A leftover certbot TXT record at
# _acme-challenge.miner.biyard.co blocks cert-manager's renewal (this exact
# collision blocked the initial issuance — a stale TXT had to be deleted from
# Route53 by hand). If a manual certbot run for *.miner.biyard.co ever happens
# again, delete its _acme-challenge TXT afterwards, or cert-manager's next
# renewal (~30 days before expiry) will wedge silently.

email: admin@biyard.co
acmeServer: https://acme-v02.api.letsencrypt.org/directory
awsRegion: ap-northeast-2
credentialsSecret: route53-credentials

# One wildcard Certificate per zone. The Certificate resource is named after
# the zone with dots replaced by dashes (miner.biyard.co → miner-biyard-co),
# so keep zone spelling stable or cert-manager re-issues under a new name.
certs:
  - dnsZone: miner.biyard.co
    secretName: miner-biyard-co-tls
  - dnsZone: dev.biyard.co
    secretName: dev-biyard-co-tls
  - dnsZone: pr.biyard.co
    secretName: pr-biyard-co-tls
  # hackartist.io는 다른 AWS 계정의 존 — 전용 자격증명 Secret 사용
  # (cert-manager ns에 수동 생성, 레포에 값 없음):
  #   kubectl -n cert-manager create secret generic route53-hackartist-credentials \
  #     --from-literal=access-key-id='...' --from-literal=secret-access-key='...'
  - dnsZone: hackartist.io
    secretName: hackartist-io-tls
    credentialsSecret: route53-hackartist-credentials
