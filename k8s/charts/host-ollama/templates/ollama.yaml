# No selector: endpoints are managed manually by the EndpointSlice below,
# which points outside the cluster at the host's ollama.
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama-host
  labels:
    kubernetes.io/service-name: ollama
addressType: IPv4
ports:
  - name: http
    port: {{ .Values.port }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ .Values.hostIP | quote }}
    conditions:
      ready: true
